<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Timetable Maker</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body>
<nav><a class="brand" href="{{url_for('home')}}">◉ Smart Timetable</a><div class="nav-right">{% if session.get('role') %}<span>{{session.get('role')|title}}</span><a href="{{url_for('logout')}}">Logout</a>{% else %}<a href="{{url_for('admin_login')}}">Login</a>{% endif %}</div></nav>
<main>{% with ms=get_flashed_messages() %}{% for m in ms %}<div class="flash">{{m}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>
<footer>Smart College Timetable Maker • Prototype</footer></body></html>
