{% extends "base.html" %}{% block content %}
<div class="auth-shell"><div class="auth-card"><div class="eyebrow">ADMINISTRATOR</div><h1>Create college account</h1><p class="muted">Register the college first. Email and phone verification are required before login.</p>
<form method="post"><label>College name</label><input name="college_name" required placeholder="College / Institution name"><label>College location</label><input name="location" required placeholder="City, State"><label>College email</label><input type="email" name="email" required placeholder="official@email.com"><label>College mobile number</label><input name="phone" required placeholder="+91 ..."><div class="two"><div><label>Create password</label><input type="password" name="password" required></div><div><label>Confirm password</label><input type="password" name="confirm_password" required></div></div><button class="primary full">Create Account & Verify →</button></form><p class="bottom-link">Already registered? <a href="{{url_for('admin_login')}}">Admin Login</a></p></div></div>{% endblock %}
